
name: Platform CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate Docker Compose Integration
    runs-on: ubuntu-latest

    env:
      API_SECRET_KEY: ci-only-test-secret-not-for-production

    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v4

      - name: Checkout backend main
        uses: actions/checkout@v4
        with:
          repository: walesplus/zuriapp-backend
          ref: main
          path: zuriapp-backend

      - name: Checkout frontend main
        uses: actions/checkout@v4
        with:
          repository: walesplus/zuriapp-frontend
          ref: main
          path: zuriapp-frontend

      - name: Prepare platform directory
        run: |
          mkdir -p zuri-platform
          cp docker-compose.yml zuri-platform/docker-compose.yml

      - name: Validate Docker Compose
        working-directory: zuri-platform
        run: docker compose config --quiet

      - name: Build application stack
        working-directory: zuri-platform
        run: docker compose build

      - name: Start application stack
        working-directory: zuri-platform
        run: docker compose up -d --wait --wait-timeout 120

      - name: Test backend health
        run: curl --fail --show-error http://localhost:5001/api/health

      - name: Test frontend and reverse proxy
        run: |
          curl --fail --show-error http://localhost:8080/
          curl --fail --show-error http://localhost:8080/api/health
          curl --fail --show-error http://localhost:8080/api/products

      - name: Show logs on failure
        if: failure()
        working-directory: zuri-platform
        run: docker compose logs --tail=100

      - name: Stop containers
        if: always()
        working-directory: zuri-platform
        run: docker compose down

  terraform-validate:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        run: terraform validate

  security-scan:
    name: Scan Repository Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan repository with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
