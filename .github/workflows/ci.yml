
name: Platform CI

on:
  push:
    branches:
      - main
      - feature/platform

  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout platform repository
        uses: actions/checkout@v4

      - name: Checkout backend repository
        uses: actions/checkout@v4
        with:
          repository: walesplus/zuriapp-backend
          ref: feature/backend
          path: zuriapp-backend

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          repository: walesplus/zuriapp-frontend
          ref: feature/frontend
          path: zuriapp-frontend

      - name: Prepare platform directory
        run: |
          mkdir zuri-platform
          cp docker-compose.yml zuri-platform/docker-compose.yml

      - name: Validate Docker Compose
        working-directory: zuri-platform
        run: docker compose config

      - name: Build application stack
        working-directory: zuri-platform
        run: docker compose build

      - name: Start application stack
        working-directory: zuri-platform
        run: docker compose up -d

      - name: Show running containers
        working-directory: zuri-platform
        run: docker compose ps

      - name: Wait for services
        run: sleep 10

      - name: Test backend health
        run: |
          curl --fail http://localhost:5001/api/store

      - name: Test frontend health
        run: |
          curl --fail http://localhost:3000

  terraform-validate:
    name: Validate Terraform Infrastructure
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        run: terraform init -backend=false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Validate Terraform configuration
        run: terraform validate

  security-scan:
    name: Scan Repository Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Trivy using Docker
        run: |
          docker pull aquasec/trivy:0.65.0

      - name: Run Trivy security scanner
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.65.0 fs \
            --scanners vuln,misconfig,secret \
            --severity HIGH,CRITICAL \
            --exit-code 0 \
            /workspace
