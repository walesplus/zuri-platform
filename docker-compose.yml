services:

  backend:
    build:
      context: ../zuriapp-backend
      dockerfile: Dockerfile
    container_name: zuri-backend-compose
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      STORE_NAME: Zuri Store
      API_SECRET_KEY: zuri-capstone-secret-2026
    restart: unless-stopped

  frontend:
    build:
      context: ../zuriapp-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:5001
    container_name: zuri-frontend-compose
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped