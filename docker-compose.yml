
services:
  backend:
    build:
      context: ../zuriapp-backend
      dockerfile: Dockerfile
    container_name: zuri-backend-compose
    ports:
      - "5001:5000"
    environment:
      PORT: "5000"
      STORE_NAME: "Zuri Store"
      API_SECRET_KEY: ${API_SECRET_KEY:?Set API_SECRET_KEY in .env}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5000/api/health').then(r => {if (!r.ok) process.exit(1)}).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  frontend:
    build:
      context: ../zuriapp-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
        VITE_STORE_NAME: "Zuri Store"
    container_name: zuri-frontend-compose
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
