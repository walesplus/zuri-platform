apiVersion: apps/v1
kind: Deployment

metadata:
  name: zuri-frontend
  labels:
    app: zuri-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zuri-frontend

  template:
    metadata:
      labels:
        app: zuri-frontend

    spec:
      containers:
        - name: frontend
          image: ghcr.io/walesplus/zuriapp-frontend:1.0
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
