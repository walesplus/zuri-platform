
apiVersion: apps/v1
kind: Deployment

metadata:
  name: zuri-frontend
  labels:
    app: zuri-frontend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zuri-frontend

  template:
    metadata:
      labels:
        app: zuri-frontend

    spec:
      containers:
        - name: frontend
          image: ghcr.io/walesplus/zuriapp-frontend:21e38bedaf3e4dbff305d121f55103bd9f3c06bf
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"

      volumes:
        - name: nginx-config
          configMap:
            name: zuri-frontend-config
            items:
              - key: default.conf
                path: default.conf
