
apiVersion: apps/v1
kind: Deployment

metadata:
  name: zuri-backend
  labels:
    app: zuri-backend

spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: zuri-backend

  template:
    metadata:
      labels:
        app: zuri-backend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: backend
          image: ghcr.io/walesplus/zuriapp-backend:1.2
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: STORE_NAME
              valueFrom:
                configMapKeyRef:
                  name: zuri-backend-config
                  key: STORE_NAME

            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: zuri-backend-secret
                  key: API_SECRET_KEY

          startupProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
