
apiVersion: apps/v1
kind: Deployment

metadata:
  name: zuri-backend
  labels:
    app: zuri-backend

spec:
  replicas: 1

  selector:
    matchLabels:
      app: zuri-backend

  template:
    metadata:
      labels:
        app: zuri-backend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001

      containers:
        - name: backend
          image: ghcr.io/walesplus/zuriapp-backend:1.1
          imagePullPolicy: IfNotPresent

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

          ports:
            - containerPort: 5000

          env:
            - name: PORT
              value: "5000"

            - name: STORE_NAME
              valueFrom:
                configMapKeyRef:
                  name: zuri-backend-config
                  key: STORE_NAME

            - name: API_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: zuri-backend-secret
                  key: API_SECRET_KEY
