apiVersion: v1
kind: Service

metadata:
  name: zuri-backend-service
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "5000"

spec:
  type: ClusterIP

  selector:
    app: zuri-backend

  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000