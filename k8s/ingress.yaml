apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: zuri-ingress

spec:
  ingressClassName: nginx

  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: zuri-backend-service
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: zuri-frontend-service
                port:
                  number: 80
